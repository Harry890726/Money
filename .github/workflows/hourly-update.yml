name: 每小時更新投資建議

on:
  schedule:
    - cron: "17 * * * *"   # 每小時第 17 分執行（UTC）
  workflow_dispatch:        # 可在 Actions 頁面手動執行
  push:
    branches: [main]
    paths: ["stock_advisor/**", "docs/index.html", ".github/workflows/hourly-update.yml"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: hourly-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: 產生建議
        run: python -m stock_advisor
      - name: 提交更新的資料
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898732+github-actions[bot]@users.noreply.github.com"
          git add docs/data reports
          git diff --cached --quiet || git commit -m "chore: 更新投資建議 $(date -u +'%Y-%m-%d %H:%M UTC')"
          git pull --rebase --autostash && git push
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
