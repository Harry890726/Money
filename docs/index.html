<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>台美股投資建議</title>
<style>
:root{
  --bg:#f6f7f9;--card:#fff;--fg:#1b1f24;--muted:#667085;--line:#e4e7ec;
  --up:#d92d20;--down:#079455;--accent:#2e5bff;
  --r-sb:#b42318;--r-b:#e8590c;--r-h:#667085;--r-s:#0e9384;--r-ss:#067647;
}
/* 台灣慣例：紅漲綠跌 */
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1115;--card:#171a21;--fg:#e6e8ec;--muted:#98a2b3;--line:#2a2f3a;--up:#f97066;--down:#32d583;--accent:#7b9bff;
}}
:root[data-theme="dark"]{--bg:#0f1115;--card:#171a21;--fg:#e6e8ec;--muted:#98a2b3;--line:#2a2f3a;--up:#f97066;--down:#32d583;--accent:#7b9bff;}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.55 system-ui,-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif}
.wrap{max-width:1180px;margin:0 auto;padding:20px 16px 48px}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:baseline;justify-content:space-between}
h1{font-size:22px;margin:0}
.muted{color:var(--muted);font-size:13px}
.tabs{display:flex;gap:6px;margin:18px 0 12px}
.tabs button{border:1px solid var(--line);background:var(--card);color:var(--fg);padding:7px 16px;border-radius:999px;cursor:pointer;font:inherit}
.tabs button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.kpi .v{font-size:22px;font-weight:650;font-variant-numeric:tabular-nums}
.up{color:var(--up)}.down{color:var(--down)}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th,td{padding:9px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th{font-size:12px;color:var(--muted);font-weight:500}
th:nth-child(-n+2),td:nth-child(-n+2),td.reason,th.reason{text-align:left}
td.reason{white-space:normal;color:var(--muted);font-size:13px;min-width:220px}
tr.row{cursor:pointer}tr.row:hover{background:color-mix(in srgb,var(--accent) 6%,transparent)}
.badge{display:inline-block;padding:2px 9px;border-radius:999px;color:#fff;font-size:12px;font-weight:600}
.scroll{overflow-x:auto}
.detail td{background:color-mix(in srgb,var(--accent) 4%,transparent);text-align:left;white-space:normal}
a{color:var(--accent)}
.news a{color:var(--fg);text-decoration:none}.news a:hover{text-decoration:underline}
.news li{margin:5px 0}
ul{padding-left:18px;margin:6px 0}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:middle}
.disc{margin-top:24px;font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding-top:12px}
h2{font-size:16px;margin:22px 0 10px}
.themes{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px}
.theme h3{font-size:15px;margin:0 0 4px;display:flex;justify-content:space-between;gap:8px}
.bar{position:relative;height:6px;background:var(--line);border-radius:3px;margin:8px 0}
.bar i{position:absolute;top:0;bottom:0;border-radius:3px}
.bar::after{content:"";position:absolute;left:50%;top:-3px;bottom:-3px;width:1px;background:var(--muted)}
.chip{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:1px 8px;margin:2px 4px 2px 0;font-size:12px}
details summary{cursor:pointer;color:var(--muted);font-size:13px;margin-top:6px}
.rbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;margin-top:12px;font-size:13px}
.rbar select,.rbar button{font:inherit;font-size:13px;padding:5px 10px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--fg)}
.rbar button{cursor:pointer}.rbar button:disabled{opacity:.5;cursor:default}
.switch{display:inline-flex;align-items:center;gap:6px;cursor:pointer;user-select:none}
.switch input{appearance:none;width:34px;height:20px;border-radius:10px;background:var(--line);position:relative;cursor:pointer;margin:0;transition:background .2s}
.switch input::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:left .2s}
.switch input:checked{background:var(--accent)}.switch input:checked::after{left:16px}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:14px;opacity:0;pointer-events:none;transition:all .3s;z-index:10;max-width:calc(100% - 32px)}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@keyframes flash{from{background:color-mix(in srgb,var(--accent) 18%,transparent)}to{background:transparent}}
.flash{animation:flash 1.6s ease-out}
.warn{background:#fef0c7;color:#7a2e0e;padding:8px 12px;border-radius:8px;margin-top:10px;font-size:13px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>台美股投資建議</h1>
    <span class="muted" id="ts">載入中…</span>
  </header>
  <div class="rbar" id="rbar">
    <label class="switch"><input type="checkbox" id="auto"><span>自動刷新</span></label>
    <select id="every" aria-label="刷新間隔"><option value="30">每 30 秒</option><option value="60">每 1 分鐘</option><option value="300">每 5 分鐘</option></select>
    <span id="countdown" class="muted"></span>
    <button id="now" type="button">↻ 立即刷新</button>
  </div>
  <div id="toast" role="status" aria-live="polite"></div>
  <div id="demo"></div>
  <div class="tabs" id="tabs"></div>
  <div id="view"></div>
  <p class="disc">本頁由演算法約每 5 分鐘自動更新（新聞每 30 分鐘重新搜尋；股價來自 Yahoo Finance，約延遲 15～20 分鐘），綜合技術指標（均線、RSI、MACD、布林通道、動能、量能）、個股新聞、時事主題對應產業與國家新聞情緒分數產生建議，僅供研究參考，不構成任何投資建議。投資有風險，請自行判斷並承擔盈虧。</p>
</div>
<script>
const RC={"強力買進":"var(--r-sb)","買進":"var(--r-b)","持有觀望":"var(--r-h)","減碼":"var(--r-s)","賣出":"var(--r-ss)"};
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pct=v=>v==null?"—":`<span class="${v>0?"up":v<0?"down":""}">${v>0?"+":""}${v.toFixed(2)}%</span>`;
const num=(v,d=2)=>v==null?"—":v.toLocaleString(undefined,{minimumFractionDigits:d,maximumFractionDigits:d});
const sc=v=>`<span class="${v>0?"up":v<0?"down":""}">${v>0?"+":""}${v.toFixed(2)}</span>`;
const safeUrl=u=>/^https?:\/\//.test(u||"")?u:"#";

function spark(arr){
  if(!arr||arr.length<2)return"";
  const w=110,h=28,mn=Math.min(...arr),mx=Math.max(...arr),k=(mx-mn)||1;
  const pts=arr.map((v,i)=>`${(i/(arr.length-1)*w).toFixed(1)},${(h-2-(v-mn)/k*(h-4)).toFixed(1)}`).join(" ");
  const col=arr.at(-1)>=arr[0]?"var(--up)":"var(--down)";
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}"><polyline fill="none" stroke="${col}" stroke-width="1.5" points="${pts}"/></svg>`;
}
// 依新聞發布時間即時計算「多久前」，並附上台北時間
function newsAge(ts,ageH){
  let ms;
  if(ts)ms=Date.now()-ts*1000;
  else if(ageH!==""&&ageH!=null&&DATA)ms=Date.now()-new Date(DATA.generated_at)+ageH*3600000;
  else return"";
  const m=Math.max(0,Math.floor(ms/60000));
  const rel=m<1?"剛剛":m<60?`${m} 分鐘前`:m<1440?`${Math.floor(m/60)} 小時${m%60?` ${m%60} 分`:""}前`:`${Math.floor(m/1440)} 天前`;
  const at=ts?new Date(ts*1000).toLocaleString("zh-TW",{timeZone:"Asia/Taipei",month:"numeric",day:"numeric",hour:"2-digit",minute:"2-digit",hour12:false}):"";
  return at?`${rel} · ${at}`:rel;
}
function refreshNewsAges(){document.querySelectorAll(".news-age").forEach(el=>{el.textContent=newsAge(+el.dataset.ts||0,el.dataset.age===""?null:+el.dataset.age);});}
function newsList(items){
  if(!items?.length)return`<p class="muted">暫無新聞</p>`;
  return `<ul class="news">${items.map(n=>{
    const c=n.sentiment>0.1?"var(--up)":n.sentiment<-0.1?"var(--down)":"var(--muted)";
    return `<li><span class="dot" style="background:${c}"></span><a href="${esc(safeUrl(n.link))}" target="_blank" rel="noopener">${esc(n.title)}</a> <span class="muted news-age" data-ts="${n.ts||""}" data-age="${n.age_hours??""}">${newsAge(n.ts,n.age_hours)}</span></li>`;
  }).join("")}</ul>`;
}
function renderFx(data){
  const fx=data.fx||{},rates=fx.rates||[];
  if(!rates.length){document.getElementById("view").innerHTML=`<div class="card">匯率資料暫時無法取得</div>`;return;}
  const g=(r,k,s)=>{const v=(r[k]||{})[s];return v==null?"—":v.toLocaleString(undefined,{maximumFractionDigits:4})};
  const usd=rates.find(r=>r.code==="USD");
  let html=`<div class="grid">
    <div class="card kpi"><div class="muted">美元即期賣出（買美元用）</div><div class="v">${g(usd||{},"spot","sell")}</div><div>${usd&&usd.change_pct!=null?pct(usd.change_pct)+" 較上次":"<span class=muted>首次紀錄</span>"}</div></div>
    <div class="card kpi"><div class="muted">美元即期買進（賣美元用）</div><div class="v">${g(usd||{},"spot","buy")}</div><div class="muted">買賣價差 ${usd?(usd.spot.sell-usd.spot.buy).toFixed(3):"—"}</div></div>
    <div class="card kpi"><div class="muted">資料時間</div><div style="font-size:15px;margin-top:6px">${esc(fx.board_time||"—")}</div><div class="muted"><a href="${esc(safeUrl(fx.url))}" target="_blank" rel="noopener">${esc(fx.source||"國泰世華銀行")}</a></div></div>
  </div>
  <h2>牌告匯率（1 外幣兌台幣）</h2>
  <div class="card scroll" style="padding:4px 8px"><table>
  <thead><tr><th>幣別</th><th>代號</th><th>即期買進</th><th>即期賣出</th><th>數位優惠買進</th><th>數位優惠賣出</th><th>現鈔買進</th><th>現鈔賣出</th><th>較上次</th></tr></thead><tbody>
  ${rates.map(r=>`<tr><td>${esc(r.name)}</td><td><b>${esc(r.code)}</b></td><td>${g(r,"spot","buy")}</td><td>${g(r,"spot","sell")}</td><td>${g(r,"digital","buy")}</td><td>${g(r,"digital","sell")}</td><td>${g(r,"cash","buy")}</td><td>${g(r,"cash","sell")}</td><td>${r.change_pct==null?"—":pct(r.change_pct)}</td></tr>`).join("")}
  </tbody></table></div>
  <p class="muted">銀行買進＝你把外幣賣給銀行的價格；銀行賣出＝你向銀行買外幣的價格。「較上次」為與約一小時前紀錄相比的即期賣出匯率變化，數字上升代表台幣貶值。匯率以銀行實際成交為準。</p>`;
  document.getElementById("view").innerHTML=html;
}
const ST={"交易中":"var(--up)","盤前":"var(--r-b)","已收盤":"var(--muted)","休市（週末）":"var(--muted)","休市（假日）":"var(--muted)"};
function quoteLine(q){
  if(!q)return"";
  const st=q.status?`<span class="badge" style="background:${ST[q.status]||"var(--muted)"};font-size:11px">${esc(q.status)}</span>`:"";
  let t=q.time_taipei?`股價時間 ${esc(q.time_taipei)}`+(q.time_local&&q.time_local!==q.time_taipei?`<br><span style="font-size:12px">（當地 ${esc(q.time_local)}）</span>`:""):q.date_only?`股價日期 ${esc(q.date_only)}`:"股價時間 —";
  return `<div class="muted" style="margin-top:6px;font-size:13px">${st} ${t}</div>`;
}
function render(data,code){
  const m=data.markets[code],ix=m.index;
  const counts={};m.stocks.forEach(s=>counts[s.rating]=(counts[s.rating]||0)+1);
  let html=`<div class="grid">
    <div class="card kpi"><div class="muted">${esc(ix.name)}</div><div class="v">${num(ix.price)}</div><div>${pct(ix.change_pct)} 今日 · ${pct(ix.ret_20d)} 20日</div>${quoteLine(m.quote)}</div>
    <div class="card kpi"><div class="muted">市場綜合分數</div><div class="v">${sc(m.market_score)}</div><div class="muted">${esc(m.market_view)}</div></div>
    <div class="card kpi"><div class="muted">國家新聞情緒</div><div class="v">${sc(m.macro_sentiment)}</div><div class="muted">${m.headlines.length} 則近期新聞</div></div>
    <div class="card kpi"><div class="muted">建議分布</div><div style="margin-top:6px">${Object.keys(RC).filter(k=>counts[k]).map(k=>`<span class="badge" style="background:${RC[k]};margin:2px">${k} ${counts[k]}</span>`).join("")}</div></div>
  </div>
  <h2>個股建議（點擊列查看細節）</h2>
  <div class="card scroll" style="padding:4px 8px"><table>
  <thead><tr><th>代號</th><th>名稱</th><th>價格</th><th>今日</th><th>20日</th><th>近60日</th><th>RSI</th><th>技術</th><th>新聞</th><th>主題</th><th>總分</th><th>建議</th><th>信心</th></tr></thead><tbody>`;
  m.stocks.forEach((s,i)=>{
    html+=`<tr class="row" data-i="${i}" data-sym="${esc(s.symbol)}"><td><b>${esc(s.symbol)}</b></td><td>${esc(s.name)}</td><td>${num(s.price)}</td><td>${pct(s.change_pct)}</td><td>${pct(s.ret_20d)}</td><td>${spark(s.spark)}</td><td>${s.rsi14==null?"—":s.rsi14.toFixed(0)}</td><td>${sc(s.technical_score)}</td><td>${sc(s.news_score)}</td><td>${sc(s.theme_score??0)}</td><td><b>${sc(s.score)}</b></td><td><span class="badge" style="background:${RC[s.rating]}">${esc(s.rating)}</span></td><td>${esc(s.confidence)}</td></tr>
    <tr class="detail" id="d${i}" hidden><td colspan="13"><div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(280px,1fr))">
      <div><b>判斷理由</b><ul>${s.reasons.map(r=>`<li>${esc(r)}</li>`).join("")||"<li>訊號中性</li>"}</ul>
      ${(s.themes||[]).length?`<div style="margin-bottom:6px">${s.themes.map(h=>`<span class="chip">${esc(h.name)} ${sc(h.impact)}</span>`).join("")}</div>`:""}
      ${s.price_twd?`<div class="muted">約 NT$ ${num(s.price_twd,0)} / 股（國泰即期賣出匯率換算）</div>`:""}
      <span class="muted">20MA ${num(s.sma20)} · 50MA ${num(s.sma50)} · 年化波動 ${s.volatility??"—"}%</span></div>
      <div><b>相關新聞</b>${newsList(s.news)}</div></div></td></tr>`;
  });
  html+=`</tbody></table></div>`;
  const tmap=Object.fromEntries((data.themes||[]).map(t=>[t.id,t]));
  if((m.themes||[]).length){
    html+=`<h2>時事主題（訊號 × 個股曝險 = 主題分數）</h2><div class="themes">`;
    m.themes.forEach(t=>{
      const g=tmap[t.id]||{},v=t.signal,w=Math.min(50,Math.abs(v)*50);
      const col=v>0?"var(--up)":"var(--down)";
      html+=`<div class="card theme"><h3><span>${esc(t.name)}</span>${sc(v)}</h3>
        <div class="bar"><i style="background:${col};${v>=0?`left:50%`:`left:${50-w}%`};width:${w}%"></i></div>
        <div class="muted">新聞熱度 ${Math.round(t.heat*100)}% · ${v>0.1?"利多":v<-0.1?"利空":"中性"}</div>
        <div style="margin-top:6px">${t.stocks.map(x=>`<span class="chip">${esc(x.name)}${x.exposure<0?" ↘反向":""}</span>`).join("")}</div>
        <details data-k="${esc(code+t.id)}"><summary>相關新聞</summary>${newsList(g.headlines)}</details></div>`;
    });
    html+=`</div>`;
  }
  html+=`<h2>大盤訊號</h2><div class="card"><ul>${ix.reasons.map(r=>`<li>${esc(r)}</li>`).join("")||"<li>訊號中性</li>"}</ul></div>
  <h2>國家重點新聞</h2><div class="card">${newsList(m.headlines)}</div>`;
  const v=document.getElementById("view");v.innerHTML=html;
  v.querySelectorAll("tr.row").forEach(tr=>tr.onclick=()=>{const d=document.getElementById("d"+tr.dataset.i);d.hidden=!d.hidden;
    d.hidden?openRows.delete(tr.dataset.sym):openRows.add(tr.dataset.sym);});
  v.querySelectorAll("tr.row").forEach(tr=>{if(openRows.has(tr.dataset.sym))document.getElementById("d"+tr.dataset.i).hidden=false;});
  v.querySelectorAll("details[data-k]").forEach(d=>{d.open=openDetails.has(d.dataset.k);d.ontoggle=()=>d.open?openDetails.add(d.dataset.k):openDetails.delete(d.dataset.k);});
}
const openRows=new Set(),openDetails=new Set();
let DATA=null,lastLoad=0,timer=null,nextAt=0,pageHash=null,checks=0;
const store={get:(k,d)=>{try{return localStorage.getItem(k)??d}catch{return d}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch{}}};
const hash=t=>{let h=0;for(let i=0;i<t.length;i++)h=(h*31+t.charCodeAt(i))|0;return h};
function toast(msg){const el=document.getElementById("toast");el.textContent=msg;el.classList.add("show");clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.remove("show"),2600);}
function showTime(){
  if(!DATA)return;
  const t=new Date(DATA.generated_at),mins=Math.max(0,Math.round((Date.now()-t)/60000));
  const ago=mins<60?`${mins} 分鐘前`:mins<1440?`${Math.floor(mins/60)} 小時 ${mins%60} 分前`:`${Math.floor(mins/1440)} 天前`;
  document.getElementById("ts").innerHTML=`資料時間：${esc(t.toLocaleString("zh-TW",{timeZone:"Asia/Taipei",hour12:false}))}（${ago}）`+
    (lastLoad?`<br><span style="font-size:12px">最後檢查 ${new Date(lastLoad).toLocaleTimeString("zh-TW",{hour12:false})}</span>`:"");
}
function draw(){
  const data=DATA,codes=[...Object.keys(data.markets),"FX"];
  const label=c=>c==="FX"?"國泰匯率":data.markets[c].name;
  let cur=store.get("mkt",codes[0]);if(!codes.includes(cur))cur=codes[0];
  const tabs=document.getElementById("tabs");
  tabs.innerHTML=codes.map(c=>`<button class="${c===cur?"on":""}" data-c="${c}">${esc(label(c))}</button>`).join("");
  tabs.querySelectorAll("button").forEach(b=>b.onclick=()=>{store.set("mkt",b.dataset.c);draw();});
  cur==="FX"?renderFx(data):render(data,cur);
}
async function load(manual){
  const btn=document.getElementById("now");btn.disabled=true;
  try{
    const r=await fetch("data/latest.json?t="+Date.now(),{cache:"no-store"});
    if(!r.ok)throw new Error("HTTP "+r.status);
    const data=await r.json();lastLoad=Date.now();
    const changed=!DATA||data.generated_at!==DATA.generated_at;
    if(changed){
      const first=!DATA,y=window.scrollY;DATA=data;
      if(data.demo)document.getElementById("demo").innerHTML=`<div class="warn">目前顯示的是離線示範資料，等待第一次自動更新後會換成真實行情。</div>`;
      draw();
      if(!first){window.scrollTo(0,y);document.getElementById("view").classList.remove("flash");void document.body.offsetWidth;document.getElementById("view").classList.add("flash");toast("已更新為最新資料");}
    }else if(manual)toast("目前已是最新資料");
    showTime();
    if(++checks%10===0)checkNewVersion();
  }catch(e){
    if(!DATA)document.getElementById("ts").textContent="資料載入失敗："+e.message;
    else if(manual)toast("刷新失敗，稍後會自動再試");
  }finally{btn.disabled=false;schedule();}
}
// 網站程式有更新時（例如新增功能），自動重新整理整個頁面
async function checkNewVersion(){
  try{const h=hash(await (await fetch("index.html?t="+Date.now(),{cache:"no-store"})).text());
    if(pageHash===null)pageHash=h;else if(h!==pageHash){toast("網站已更新，重新載入中…");setTimeout(()=>location.reload(),1200);}}catch{}
}
function schedule(){
  clearTimeout(timer);nextAt=0;
  if(!document.getElementById("auto").checked||document.visibilityState!=="visible")return;
  const sec=+document.getElementById("every").value;nextAt=Date.now()+sec*1000;timer=setTimeout(()=>load(false),sec*1000);
}
setInterval(()=>{  // 倒數顯示 + 「幾分鐘前」持續更新
  const el=document.getElementById("countdown");
  if(!document.getElementById("auto").checked)el.textContent="已暫停";
  else if(nextAt){const s=Math.max(0,Math.ceil((nextAt-Date.now())/1000));el.textContent=`${s} 秒後刷新`;}
  showTime();
  if(Date.now()%30000<1000)refreshNewsAges();  // 每 30 秒更新新聞的「多久前」
},1000);
(()=>{
  const auto=document.getElementById("auto"),every=document.getElementById("every");
  auto.checked=store.get("auto","1")==="1";every.value=store.get("every","60");if(!every.value)every.value="60";
  auto.onchange=()=>{store.set("auto",auto.checked?"1":"0");auto.checked?load(false):schedule();};
  every.onchange=()=>{store.set("every",every.value);schedule();};
  document.getElementById("now").onclick=()=>load(true);
  // 切到其他 App 時暫停，切回來立即檢查一次
  const back=()=>{if(document.visibilityState==="visible"){if(auto.checked&&Date.now()-lastLoad>15000)load(false);else schedule();}else{clearTimeout(timer);nextAt=0;}};
  document.addEventListener("visibilitychange",back);
  window.addEventListener("pageshow",e=>{if(e.persisted)back();});
  checkNewVersion();load(false);
})();
</script>
</body>
</html>
